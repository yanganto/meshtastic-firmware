[env:xiao-esp32c6-sx1262]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = pr
build_flags =
  ${esp32c6_base.build_flags}
  -D XIAO_ESP32C6
  -D PRIVATE_HW
  -I variants/esp32c6/xiao_esp32c6
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

  -DHAS_WIFI
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=24576

  ; USE_BB_HAL: enables BBTxRXHal in RadioInterface.cpp which calls
  ; gpio_reset_pin(SX126X_CS) in its constructor. This is required because
  ; Wire.begin(22, 23) claims GPIO22 (SX1262 CS/D4) via the I2C peripheral
  ; before radio init, preventing SPI CS from working without a pin reset.
  -DUSE_BB_HAL

build_src_filter =
  ${esp32c6_base.build_src_filter} +<../variants/esp32c6/xiao_esp32c6>
